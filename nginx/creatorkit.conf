server {
    listen 80;
    listen [::]:80;

    # Accept the server IP, localhost, and any configured domain.
    server_name _;

    root /mnt/c/Users/krish/OneDrive/Documents/Projects/CreatorKit_Web/dist;
    index index.html;

    # Vite fingerprints production assets, so they can be cached permanently.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Send client-side routes back to the React entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
